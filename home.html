<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Slot Game</title>
  <style>
    body { font-family: Arial; text-align: center; background: #111; color: white; }
    .reels { display: flex; justify-content: center; margin: 20px; }
    .reel { font-size: 3em; margin: 0 10px; width: 80px; height: 80px; background: #333; border-radius: 10px; line-height: 80px; }
    button { padding: 10px 20px; font-size: 1.2em; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Mini Slot Machine 🎰</h1>
  <div class="reels">
    <div class="reel" id="r1">🍒</div>
    <div class="reel" id="r2">🍋</div>
    <div class="reel" id="r3">🍊</div>
  </div>
  <button onclick="spin()">SPIN</button>
  <p id="result"></p>

  <script>
    const symbols = ["🍒", "🍋", "🍊", "🍇", "⭐", "💎"];
    function spin() {
      const r1 = symbols[Math.floor(Math.random() * symbols.length)];
      const r2 = symbols[Math.floor(Math.random() * symbols.length)];
      const r3 = symbols[Math.floor(Math.random() * symbols.length)];

      document.getElementById("r1").textContent = r1;
      document.getElementById("r2").textContent = r2;
      document.getElementById("r3").textContent = r3;

      if (r1 === r2 && r2 === r3) {
        document.getElementById("result").textContent = "🎉 JACKPOT!";
      } else {
        document.getElementById("result").textContent = "Try again!";
      }
    }
  </script>
</body>
</html>
